<!DOCTYPE html>
<html data-i18n-title="popupTitle">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Threads Follow Checker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header>
      <h1 data-i18n="popupTitle">Threads Follow Checker</h1>
      <p class="subtitle" data-i18n="popupSubtitle">Check if your followings follow you back</p>
    </header>

    <!-- Tab detection hint -->
    <div id="tab-hint" class="tab-hint"></div>

    <!-- Step 1: Scan Following -->
    <section id="step1" class="step">
      <div class="step-header">
        <span class="step-num">1</span>
        <span class="step-title" data-i18n="step1Title">Scan your Following list</span>
      </div>
      <p class="step-desc" data-i18n="step1Desc">Open your Threads profile, tap "Following" to open the list, then click the button below.</p>
      <button id="btn-scan-following" class="btn btn-primary" data-i18n="btnScanFollowing">Scan Following</button>
      <div id="following-status" class="status"></div>
    </section>

    <!-- Step 2: Scan Followers -->
    <section id="step2" class="step">
      <div class="step-header">
        <span class="step-num">2</span>
        <span class="step-title" data-i18n="step2Title">Scan your Followers list</span>
      </div>
      <p class="step-desc" data-i18n="step2Desc">Now tap "Followers" to open the list, then click the button below.</p>
      <button id="btn-scan-followers" class="btn btn-primary" data-i18n="btnScanFollowers">Scan Followers</button>
      <div id="followers-status" class="status"></div>
    </section>

    <!-- Step 3: Report -->
    <section id="step3" class="step">
      <div class="step-header">
        <span class="step-num">3</span>
        <span class="step-title" data-i18n="step3Title">Generate Report</span>
      </div>
      <button id="btn-report" class="btn btn-accent" data-i18n="btnReport">Generate Report (new tab)</button>
      <button id="btn-clear" class="btn btn-danger" style="display:none;" data-i18n="btnClear">Clear Data</button>
    </section>
  </div>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
